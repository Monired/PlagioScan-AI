{% extends "base.html" %}
{% block title %}Reset Password — PlagioScan AI{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center py-5" style="min-height:80vh">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-lock-fill"></i></div>
      <h3 class="fw-bold mt-3">Set New Password</h3>
      <p class="text-muted small">Choose a strong password for your account.</p>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label for="new-pw" class="form-label fw-semibold">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock" style="color:var(--accent)"></i></span>
          <input type="password" id="new-pw" name="new_password" class="form-control"
                 placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password"/>
          <span class="input-group-text" data-pw-toggle="new-pw"><i class="bi bi-eye"></i></span>
        </div>
      </div>
      <div class="mb-4">
        <label for="conf-pw" class="form-label fw-semibold">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill" style="color:var(--accent)"></i></span>
          <input type="password" id="conf-pw" name="confirm_password" class="form-control"
                 placeholder="Repeat password" required minlength="6" autocomplete="new-password"/>
          <span class="input-group-text" data-pw-toggle="conf-pw"><i class="bi bi-eye"></i></span>
        </div>
      </div>
      <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
        <i class="bi bi-check-circle me-2"></i>Reset Password
      </button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">
      <a href="{{ url_for('auth.login_page') }}" style="color:var(--accent)">
        <i class="bi bi-arrow-left me-1"></i>Back to Login
      </a>
    </p>
  </div>
</div>
{% endblock %}
