{% extends "base.html" %}{% block title %}404 Not Found — PlagioScan AI{% endblock %}
{% block content %}
<div class="container text-center py-5" style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-size:7rem;font-weight:900;color:rgba(108,99,255,.18);line-height:1">404</div>
  <h3 class="fw-bold mt-2">Page Not Found</h3>
  <p class="text-muted">The page you're looking for doesn't exist or was removed.</p>
  <a href="{{ url_for('index') }}" class="btn btn-accent mt-3 px-4">
    <i class="bi bi-house me-2"></i>Go Home
  </a>
</div>
{% endblock %}
